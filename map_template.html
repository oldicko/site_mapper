<!DOCTYPE html>
<html lang="en" class="{{THEME_CLASS}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{MAP_TITLE}}</title>
  
  <!-- Font Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <style>
    /* Dark Theme (Default) */
    :root {
      --bg-dark: #0d0d0f;
      --panel-bg: rgba(18, 18, 22, 0.75);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --card-hover: rgba(255, 255, 255, 0.04);
      --font-family: 'Outfit', sans-serif;
      --stat-card-bg: rgba(255, 255, 255, 0.02);
      --stat-card-border: rgba(255, 255, 255, 0.04);
      --search-bg: rgba(0, 0, 0, 0.2);
      --search-border: var(--panel-border);
      --search-focus-bg: rgba(0, 0, 0, 0.4);
      --search-focus-border: rgba(255, 255, 255, 0.2);
      --search-focus-shadow: rgba(255, 255, 255, 0.05);
      --h1-gradient-start: #fff;
      --scroll-thumb: rgba(255, 255, 255, 0.1);
      --scroll-thumb-hover: rgba(255, 255, 255, 0.2);
      --card-bg: rgba(255, 255, 255, 0.01);
      --bucket-card-hover-border: rgba(255, 255, 255, 0.15);
      --bucket-card-hover-bg: rgba(255, 255, 255, 0.02);
      --slider-bg: rgba(255, 255, 255, 0.1);
      --slider-dot: var(--text-muted);
      --site-list-bg: rgba(0, 0, 0, 0.15);
      --popup-bg: rgba(18, 18, 22, 0.9);
      --popup-shadow: rgba(0, 0, 0, 0.6);
      --popup-badge-bg: rgba(255, 255, 255, 0.05);
      --popup-badge-border: rgba(255, 255, 255, 0.06);
      --popup-badge-text: var(--text-muted);
      --popup-coords-text: rgba(255, 255, 255, 0.3);
      --sidebar-shadow: rgba(0, 0, 0, 0.5);
    }

    /* Light Theme Overrides */
    .light-mode {
      --bg-dark: #f8fafc;
      --panel-bg: rgba(255, 255, 255, 0.75);
      --panel-border: rgba(0, 0, 0, 0.08);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #3b82f6;
      --card-hover: rgba(0, 0, 0, 0.02);
      --stat-card-bg: rgba(0, 0, 0, 0.02);
      --stat-card-border: rgba(0, 0, 0, 0.04);
      --search-bg: rgba(255, 255, 255, 0.8);
      --search-border: rgba(0, 0, 0, 0.08);
      --search-focus-bg: #ffffff;
      --search-focus-border: rgba(0, 0, 0, 0.15);
      --search-focus-shadow: rgba(0, 0, 0, 0.03);
      --h1-gradient-start: #0f172a;
      --scroll-thumb: rgba(0, 0, 0, 0.1);
      --scroll-thumb-hover: rgba(0, 0, 0, 0.2);
      --card-bg: rgba(0, 0, 0, 0.005);
      --bucket-card-hover-border: rgba(0, 0, 0, 0.12);
      --bucket-card-hover-bg: rgba(0, 0, 0, 0.02);
      --slider-bg: rgba(0, 0, 0, 0.06);
      --slider-dot: #fff;
      --site-list-bg: rgba(0, 0, 0, 0.02);
      --popup-bg: rgba(255, 255, 255, 0.92);
      --popup-shadow: rgba(0, 0, 0, 0.1);
      --popup-badge-bg: rgba(0, 0, 0, 0.03);
      --popup-badge-border: rgba(0, 0, 0, 0.05);
      --popup-badge-text: var(--text-muted);
      --popup-coords-text: rgba(0, 0, 0, 0.4);
      --sidebar-shadow: rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      width: 100%;
      font-family: var(--font-family);
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
    }

    #app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    #map {
      height: 100%;
      width: 100%;
      z-index: 1;
      background: var(--bg-dark);
    }

    /* Floating Glassmorphic Sidebar */
    .sidebar {
      position: absolute;
      top: 20px;
      left: 20px;
      bottom: 20px;
      width: 400px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px var(--sidebar-shadow);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar-header {
      padding: 22px 24px 16px 24px;
      border-bottom: 1px solid var(--panel-border);
    }

    .sidebar-header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--h1-gradient-start) 30%, var(--text-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .sidebar-header p {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 300;
    }

    /* Stats Board */
    .stats-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 16px 24px 16px 24px;
      border-bottom: 1px solid var(--panel-border);
    }

    .stat-card {
      background: var(--stat-card-bg);
      border: 1px solid var(--stat-card-border);
      border-radius: 10px;
      padding: 10px 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* View Dimension Selector Component */
    .sidebar-view-container {
      padding: 14px 24px;
      border-bottom: 1px solid var(--panel-border);
    }

    .view-selector-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .view-selector-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .view-selector {
      display: flex;
      background: var(--stat-card-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 3px;
      gap: 4px;
    }

    .view-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 10px;
      font-family: var(--font-family);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }

    .view-btn:hover {
      color: var(--text-main);
      background: var(--card-hover);
    }

    .view-btn.active {
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
    }

    /* Floating View Control on Map */
    .map-view-control {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 5px 8px;
      box-shadow: 0 10px 30px var(--sidebar-shadow);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .map-view-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      padding-left: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Search Box */
    .search-container {
      padding: 14px 24px;
      border-bottom: 1px solid var(--panel-border);
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      border-radius: 10px;
      color: var(--text-main);
      font-family: var(--font-family);
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--search-focus-border);
      background: var(--search-focus-bg);
      box-shadow: 0 0 0 2px var(--search-focus-shadow);
    }

    .search-icon {
      position: absolute;
      left: 36px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      width: 16px;
      height: 16px;
    }

    /* Content Area */
    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
    }

    /* Custom Scrollbar */
    .sidebar-content::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .sidebar-content::-webkit-scrollbar-thumb {
      background: var(--scroll-thumb);
      border-radius: 3px;
    }

    .sidebar-content::-webkit-scrollbar-thumb:hover {
      background: var(--scroll-thumb-hover);
    }

    /* Bucket / Category Card styling */
    .bucket-card {
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .bucket-card:hover {
      border-color: var(--bucket-card-hover-border);
      background: var(--bucket-card-hover-bg);
    }

    .bucket-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .bucket-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .bucket-color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: 0 0 6px var(--dot-color);
      background-color: var(--dot-color);
      flex-shrink: 0;
    }

    .bucket-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      text-transform: capitalize;
    }

    .bucket-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .site-count-badge {
      background: var(--stat-card-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
    }

    /* Custom Switch Toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--slider-bg);
      transition: .2s;
      border-radius: 18px;
      border: 1px solid var(--panel-border);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 2px;
      bottom: 2px;
      background-color: var(--slider-dot);
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--toggle-color);
    }

    input:checked + .slider:before {
      transform: translateX(14px);
      background-color: #fff;
      box-shadow: 0 0 6px var(--toggle-color);
    }

    /* Site list under category card */
    .site-list {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-top: 0 solid var(--panel-border);
      background: var(--site-list-bg);
    }

    .bucket-card.expanded .site-list {
      max-height: 500px;
      overflow-y: auto;
      border-top: 1px solid var(--panel-border);
    }

    .site-item {
      padding: 9px 16px 9px 38px;
      font-size: 12.5px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s;
    }

    .site-item:hover {
      background: var(--card-hover);
      color: var(--text-main);
    }

    .site-subtag {
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.8;
    }

    .site-coordinates {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.3);
      font-family: monospace;
    }

    .light-mode .site-coordinates {
      color: rgba(0, 0, 0, 0.35);
    }

    /* Toggled Off state */
    .bucket-card.toggled-off {
      opacity: 0.5;
    }
    
    .bucket-card.toggled-off .bucket-name {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* Custom Leaflet Marker Styling */
    .custom-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
    }

    .marker-core {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--marker-color);
      box-shadow: 0 0 10px var(--marker-color);
      z-index: 2;
      border: 1px solid #fff;
    }

    .marker-halo {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background-color: var(--marker-color);
      opacity: 0.3;
      animation: pulse 2.5s infinite ease-in-out;
      z-index: 1;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.5);
        opacity: 0.7;
      }
      100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }

    /* Premium Leaflet Popup Override */
    .leaflet-popup-content-wrapper {
      background: var(--popup-bg) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      border: 1px solid var(--panel-border) !important;
      color: var(--text-main) !important;
      font-family: var(--font-family) !important;
      border-radius: 12px !important;
      box-shadow: 0 15px 35px var(--popup-shadow) !important;
      padding: 4px;
    }

    .leaflet-popup-tip {
      background: var(--popup-bg) !important;
      border-left: 1px solid var(--panel-border) !important;
      border-bottom: 1px solid var(--panel-border) !important;
      box-shadow: none !important;
    }

    .popup-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .popup-badges-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin: 8px 0 6px 0;
    }

    .popup-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--popup-badge-bg);
      border: 1px solid var(--popup-badge-border);
      font-size: 11px;
      transition: all 0.15s ease;
    }

    .popup-badge-row.active-dim {
      border-color: var(--active-dim-color);
      background: rgba(59, 130, 246, 0.08);
      font-weight: 600;
    }

    .popup-badge-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
      text-transform: capitalize;
    }

    .popup-badge-label {
      color: var(--text-muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .popup-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .popup-coords {
      font-size: 10px;
      color: var(--popup-coords-text);
      margin-top: 6px;
      font-family: monospace;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        width: calc(100% - 40px);
        bottom: auto;
        max-height: 48vh;
      }

      .map-view-control {
        top: auto;
        bottom: 20px;
        right: 20px;
        left: 20px;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div id="app-container">
    
    <!-- Floating Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h1>{{SIDEBAR_TITLE}}</h1>
        <p>{{MAP_SUBTITLE}}</p>
      </div>

      <!-- Stats Summary -->
      <div class="stats-container">
        <div class="stat-card">
          <div class="stat-value" id="stat-total-sites">0</div>
          <div class="stat-label">{{LABEL_TOTAL_SITES}}</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-active-groups">0</div>
          <div class="stat-label" id="stat-active-label">{{LABEL_BUCKETS}}</div>
        </div>
      </div>

      <!-- View Dimension Selector inside Sidebar -->
      <div class="sidebar-view-container">
        <div class="view-selector-header">
          <span class="view-selector-label">Categorize Sites By</span>
        </div>
        <div class="view-selector">
          <button class="view-btn active" data-view="bucket" onclick="setViewMode('bucket')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
            <span>{{LABEL_BUCKET_BTN}}</span>
          </button>
          <button class="view-btn" data-view="status" onclick="setViewMode('status')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <span>{{LABEL_STATUS_BTN}}</span>
          </button>
          <button class="view-btn" data-view="complexity" onclick="setViewMode('complexity')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            <span>{{LABEL_COMPLEXITY_BTN}}</span>
          </button>
        </div>
      </div>

      <!-- Search Box -->
      <div class="search-container">
        <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <input type="text" class="search-input" id="search-bar" placeholder="{{SEARCH_PLACEHOLDER}}">
      </div>

      <!-- Category / Group List -->
      <div class="sidebar-content" id="bucket-list-container">
        <!-- Dynamic content will be rendered here by JS -->
      </div>
    </div>

    <!-- Floating View Dimension Selector on Map Canvas -->
    <div class="map-view-control">
      <span class="map-view-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
        View:
      </span>
      <div class="view-selector">
        <button class="view-btn active" data-view="bucket" onclick="setViewMode('bucket')">
          <span>{{LABEL_BUCKET_BTN}}</span>
        </button>
        <button class="view-btn" data-view="status" onclick="setViewMode('status')">
          <span>{{LABEL_STATUS_BTN}}</span>
        </button>
        <button class="view-btn" data-view="complexity" onclick="setViewMode('complexity')">
          <span>{{LABEL_COMPLEXITY_BTN}}</span>
        </button>
      </div>
    </div>

    <!-- Map container -->
    <div id="map"></div>
    
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Turf.js for region buffering and rounding calculations -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  
  <script>
    // Data placeholders, injected by python generator
    const siteData = {{SITE_DATA_JSON}};
    const bucketData = {{BUCKET_DATA_JSON}};
    const groupsData = {{GROUPS_DATA_JSON}};
    const config = {{CONFIG_JSON}};
    const defaultView = "{{DEFAULT_VIEW}}" || 'bucket';
    const labelBuckets = "{{LABEL_BUCKETS}}";
    const labelStatus = "{{LABEL_STATUS}}";
    const labelComplexity = "{{LABEL_COMPLEXITY}}";

    // Initialize state
    const state = {
      currentView: defaultView,
      searchQuery: '',
      toggledGroups: {
        bucket: {},
        status: {},
        complexity: {}
      },
      expandedGroups: {
        bucket: {},
        status: {},
        complexity: {}
      }
    };

    // Populate toggled & expanded states for all dimensions
    ['bucket', 'status', 'complexity'].forEach(dim => {
      if (groupsData && groupsData[dim]) {
        Object.keys(groupsData[dim]).forEach(groupVal => {
          state.toggledGroups[dim][groupVal] = true; // All on by default
          state.expandedGroups[dim][groupVal] = false; // Collapsed by default
        });
      }
    });

    // Initialize Leaflet Map
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView([20, 0], 2);

    L.control.attribution({ prefix: false, position: 'bottomright' }).addTo(map);

    // Choose tile layer based on configuration
    const provider = config.tile_provider || 'esri';
    let tileUrl = '';
    let tileAttribution = '';
    let maxNativeZoom = 19;

    if (provider === 'osm') {
      tileUrl = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
      tileAttribution = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
      maxNativeZoom = 19;
    } else if (provider === 'esri_topo') {
      tileUrl = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}';
      tileAttribution = 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, TomTom';
      maxNativeZoom = 18;
    } else if (provider === 'esri_imagery') {
      tileUrl = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
      tileAttribution = 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS';
      maxNativeZoom = 18;
    } else {
      if (config.theme === 'light') {
        tileUrl = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}';
      } else {
        tileUrl = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}';
      }
      tileAttribution = 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ';
      maxNativeZoom = 16;
    }

    L.tileLayer(tileUrl, {
      maxZoom: 20,
      maxNativeZoom: maxNativeZoom,
      attribution: tileAttribution
    }).addTo(map);

    // Zoom control at bottom right
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Dictionaries to hold leaflet layer instances
    const leafletMarkers = {}; // site_name -> marker instance
    const leafletOverlays = {
      bucket: {},
      status: {},
      complexity: {}
    }; // dim -> group_val -> leaflet geojson layer

    // Helper: Create HTML element for custom marker
    function createCustomMarkerIcon(color) {
      return L.divIcon({
        className: 'custom-marker-wrapper',
        html: `<div class="custom-marker" style="--marker-color: ${color}">
                 <div class="marker-core"></div>
                 <div class="marker-halo"></div>
               </div>`,
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });
    }

    // Helper: Create marker popup HTML showcasing bucket, status, and complexity
    function createPopupContent(site) {
      const activeDim = state.currentView;
      const bColor = (groupsData.bucket && groupsData.bucket[site.bucket]) ? groupsData.bucket[site.bucket].color : '#3b82f6';
      const sColor = (groupsData.status && groupsData.status[site.status]) ? groupsData.status[site.status].color : '#94a3b8';
      const cColor = (groupsData.complexity && groupsData.complexity[site.complexity]) ? groupsData.complexity[site.complexity].color : '#f59e0b';

      return `
        <div style="padding: 4px; min-width: 200px;">
          <div class="popup-title">${site.name}</div>
          <div class="popup-badges-list">
            <div class="popup-badge-row ${activeDim === 'bucket' ? 'active-dim' : ''}" style="--active-dim-color: ${bColor}">
              <span class="popup-badge-label">${config.label_bucket_btn || 'Bucket'}</span>
              <span class="popup-badge-tag">
                <span class="popup-dot" style="background: ${bColor}"></span>
                <span>${site.bucket}</span>
              </span>
            </div>
            <div class="popup-badge-row ${activeDim === 'status' ? 'active-dim' : ''}" style="--active-dim-color: ${sColor}">
              <span class="popup-badge-label">${config.label_status_btn || config.label_status || 'Status'}</span>
              <span class="popup-badge-tag">
                <span class="popup-dot" style="background: ${sColor}"></span>
                <span>${site.status || 'N/A'}</span>
              </span>
            </div>
            <div class="popup-badge-row ${activeDim === 'complexity' ? 'active-dim' : ''}" style="--active-dim-color: ${cColor}">
              <span class="popup-badge-label">${config.label_complexity_btn || config.label_complexity || 'Complexity'}</span>
              <span class="popup-badge-tag">
                <span class="popup-dot" style="background: ${cColor}"></span>
                <span>${site.complexity || 'N/A'}</span>
              </span>
            </div>
          </div>
          <div class="popup-coords">${site.lat.toFixed(4)}, ${site.lon.toFixed(4)}</div>
        </div>
      `;
    }

    // Compute bounds and fit map to display all currently visible sites
    function fitMapToSites() {
      const activeDim = state.currentView;
      const activeCoords = [];
      siteData.forEach(site => {
        const groupVal = site[activeDim];
        if (state.toggledGroups[activeDim][groupVal] !== false) {
          activeCoords.push([site.lat, site.lon]);
        }
      });
      if (activeCoords.length > 0) {
        map.fitBounds(activeCoords, { padding: [50, 50], maxZoom: 8 });
      }
    }

    // Initialize all map shapes and markers
    function initMapLayers() {
      const showBoundaries = (config.show_bucket_boundaries !== undefined)
        ? config.show_bucket_boundaries
        : (config.show_boundaries !== undefined ? config.show_boundaries : true);

      // Build region boundaries for each dimension if enabled
      if (showBoundaries) {
        const bufferRadius = config.zone_buffer_radius_km || 40;
        const preventOverlays = config.prevent_overlaps || false;

        ['bucket', 'status', 'complexity'].forEach(dim => {
          if (!groupsData[dim]) return;
          const dimGroups = groupsData[dim];
          const rawBuffers = {};
          const dimOverlayData = {};

          Object.entries(dimGroups).forEach(([groupVal, info]) => {
            const hullCoords = info.hull;
            if (!hullCoords || hullCoords.length === 0) return;

            let geojson = null;
            try {
              if (hullCoords.length === 1) {
                const pt = turf.point([hullCoords[0][1], hullCoords[0][0]]);
                geojson = turf.buffer(pt, bufferRadius, {units: 'kilometers'});
              } else if (hullCoords.length === 2) {
                const line = turf.lineString(hullCoords.map(c => [c[1], c[0]]));
                geojson = turf.buffer(line, bufferRadius, {units: 'kilometers'});
              } else {
                const coords = hullCoords.map(c => [c[1], c[0]]);
                coords.push([hullCoords[0][1], hullCoords[0][0]]);
                const poly = turf.polygon([coords]);
                geojson = turf.buffer(poly, bufferRadius, {units: 'kilometers'});
              }
            } catch (e) {
              console.error("Error buffering region for " + groupVal + ":", e);
            }
            if (geojson) {
              rawBuffers[groupVal] = geojson;
            }
          });

          if (preventOverlays && siteData.length > 1) {
            try {
              const points = siteData.map((site, index) => {
                return turf.point([site.lon, site.lat], { index: index, group: site[dim], name: site.name });
              });
              const pointsFC = turf.featureCollection(points);
              const bbox = [-180, -85, 180, 85];
              const voronoiPolys = turf.voronoi(pointsFC, { bbox: bbox });

              const siteCells = new Map();
              voronoiPolys.features.forEach((cell) => {
                if (!cell) return;
                const ownerPoint = points.find(pt => turf.booleanPointInPolygon(pt, cell));
                if (ownerPoint) {
                  siteCells.set(ownerPoint.properties.name, cell);
                }
              });

              const groupInfluenceZones = {};
              Object.keys(dimGroups).forEach(groupVal => {
                const groupSites = siteData.filter(s => s[dim] === groupVal);
                let influenceZone = null;

                groupSites.forEach(site => {
                  const cell = siteCells.get(site.name);
                  if (!cell) return;
                  if (!influenceZone) {
                    influenceZone = JSON.parse(JSON.stringify(cell));
                  } else {
                    try {
                      influenceZone = turf.union(influenceZone, cell);
                    } catch (unionErr) {
                      console.error("Union error for " + groupVal + ":", unionErr);
                    }
                  }
                });

                if (influenceZone) {
                  groupInfluenceZones[groupVal] = influenceZone;
                }
              });

              Object.entries(rawBuffers).forEach(([groupVal, rawBuffer]) => {
                const influenceZone = groupInfluenceZones[groupVal];
                let finalGeom = rawBuffer;

                if (influenceZone) {
                  try {
                    const intersection = turf.intersect(rawBuffer, influenceZone);
                    if (intersection) finalGeom = intersection;
                  } catch (intersectErr) {
                    console.error("Intersection error for " + groupVal + ":", intersectErr);
                  }
                }
                dimOverlayData[groupVal] = finalGeom;
              });
            } catch (voronoiErr) {
              Object.entries(rawBuffers).forEach(([groupVal, rawBuffer]) => {
                dimOverlayData[groupVal] = rawBuffer;
              });
            }
          } else {
            Object.entries(rawBuffers).forEach(([groupVal, rawBuffer]) => {
              dimOverlayData[groupVal] = rawBuffer;
            });
          }

          // Build Leaflet GeoJSON layer for each group
          Object.entries(dimOverlayData).forEach(([groupVal, geojson]) => {
            const color = dimGroups[groupVal].color;
            const layer = L.geoJSON(geojson, {
              style: {
                color: color,
                fillColor: color,
                fillOpacity: 0.15,
                weight: 2,
                dashArray: '5, 5'
              }
            });
            leafletOverlays[dim][groupVal] = layer;

            if (dim === state.currentView) {
              layer.addTo(map);
            }
          });
        });
      }

      // Create Leaflet marker for each site
      siteData.forEach(site => {
        const activeDim = state.currentView;
        const groupVal = site[activeDim];
        const color = (groupsData[activeDim] && groupsData[activeDim][groupVal]) 
          ? groupsData[activeDim][groupVal].color 
          : '#ffffff';
        
        const marker = L.marker([site.lat, site.lon], {
          icon: createCustomMarkerIcon(color)
        });

        marker.bindPopup(createPopupContent(site), {
          offset: [0, -5]
        });

        marker.addTo(map);
        leafletMarkers[site.name] = marker;
      });
    }

    // Switch active view dimension (bucket, status, or complexity)
    window.setViewMode = function(newView) {
      if (state.currentView === newView) return;
      
      const oldView = state.currentView;
      state.currentView = newView;

      // Update selector buttons active states in both sidebar and map
      document.querySelectorAll('.view-btn').forEach(btn => {
        if (btn.getAttribute('data-view') === newView) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      // Remove overlays of old dimension
      if (leafletOverlays[oldView]) {
        Object.values(leafletOverlays[oldView]).forEach(layer => {
          if (map.hasLayer(layer)) map.removeLayer(layer);
        });
      }

      // Update marker icons and popups
      siteData.forEach(site => {
        const groupVal = site[newView];
        const groupInfo = (groupsData[newView] && groupsData[newView][groupVal]) || {};
        const color = groupInfo.color || '#3b82f6';
        const marker = leafletMarkers[site.name];
        if (marker) {
          marker.setIcon(createCustomMarkerIcon(color));
          marker.setPopupContent(createPopupContent(site));
        }
      });

      // Update UI, sidebar cards, and overlays
      updateApp();
    };

    // Render sidebar cards and update layer visibility
    function updateApp() {
      const activeDim = state.currentView;
      const currentGroups = (groupsData && groupsData[activeDim]) ? groupsData[activeDim] : {};
      const query = state.searchQuery.trim().toLowerCase();

      let totalSitesCount = 0;
      let activeGroupsCount = 0;

      // Update HUD/Stats labels based on active dimension
      let groupLabel = labelBuckets;
      if (activeDim === 'status') groupLabel = labelStatus;
      if (activeDim === 'complexity') groupLabel = labelComplexity;
      document.getElementById('stat-active-label').innerText = groupLabel;

      const container = document.getElementById('bucket-list-container');
      container.innerHTML = '';

      Object.entries(currentGroups).forEach(([groupVal, info]) => {
        const color = info.color;
        const sitesInGroup = siteData.filter(site => site[activeDim] === groupVal);

        // Filter sites by search query (match site name, bucket, status, complexity, or group name)
        const matchingSites = sitesInGroup.filter(site => {
          if (!query) return true;
          return site.name.toLowerCase().includes(query) ||
                 (site.bucket && site.bucket.toLowerCase().includes(query)) ||
                 (site.status && site.status.toLowerCase().includes(query)) ||
                 (site.complexity && site.complexity.toLowerCase().includes(query)) ||
                 groupVal.toLowerCase().includes(query);
        });

        const isToggledOn = state.toggledGroups[activeDim][groupVal] !== false;

        // Hide group if searching and no sites match
        if (query && matchingSites.length === 0 && !groupVal.toLowerCase().includes(query)) {
          if (leafletOverlays[activeDim] && leafletOverlays[activeDim][groupVal]) {
            map.removeLayer(leafletOverlays[activeDim][groupVal]);
          }
          sitesInGroup.forEach(site => {
            if (map.hasLayer(leafletMarkers[site.name])) {
              map.removeLayer(leafletMarkers[site.name]);
            }
          });
          return;
        }

        if (isToggledOn) {
          activeGroupsCount++;
          totalSitesCount += matchingSites.length;
        }

        // Create Category Card
        const card = document.createElement('div');
        card.className = `bucket-card ${isToggledOn ? '' : 'toggled-off'} ${state.expandedGroups[activeDim][groupVal] ? 'expanded' : ''}`;
        card.style.setProperty('--toggle-color', color);

        const safeGroupEscaped = groupVal.replace(/'/g, "\\'");
        const safeGroupId = encodeURIComponent(groupVal).replace(/%/g, '_');

        card.innerHTML = `
          <div class="bucket-header">
            <div class="bucket-info" onclick="toggleGroupExpand('${safeGroupEscaped}')">
              <span class="bucket-color-dot" style="--dot-color: ${color}"></span>
              <span class="bucket-name">${groupVal}</span>
            </div>
            <div class="bucket-actions">
              <span class="site-count-badge">${matchingSites.length} ${matchingSites.length === 1 ? 'site' : 'sites'}</span>
              <label class="switch">
                <input type="checkbox" ${isToggledOn ? 'checked' : ''} onchange="toggleGroupVisibility('${safeGroupEscaped}', this.checked)">
                <span class="slider"></span>
              </label>
            </div>
          </div>
          <div class="site-list" id="list-${safeGroupId}"></div>
        `;

        container.appendChild(card);

        // Populate sites inside expanded panel
        const siteListContainer = card.querySelector('.site-list');
        matchingSites.forEach(site => {
          const siteItem = document.createElement('div');
          siteItem.className = 'site-item';
          
          let subTag = '';
          if (activeDim === 'bucket') {
            subTag = `<span class="site-subtag">${site.status} • ${site.complexity}</span>`;
          } else if (activeDim === 'status') {
            subTag = `<span class="site-subtag">${site.bucket} • ${site.complexity}</span>`;
          } else {
            subTag = `<span class="site-subtag">${site.bucket} • ${site.status}</span>`;
          }

          siteItem.innerHTML = `
            <div style="display: flex; flex-direction: column; gap: 2px;">
              <span style="font-weight: 500;">${site.name}</span>
              ${subTag}
            </div>
            <span class="site-coordinates">${site.lat.toFixed(2)}, ${site.lon.toFixed(2)}</span>
          `;

          siteItem.onclick = () => {
            if (isToggledOn) {
              focusSite(site.name);
            }
          };

          siteListContainer.appendChild(siteItem);
        });

        // Overlay & Marker map visibility
        const overlayLayer = leafletOverlays[activeDim] ? leafletOverlays[activeDim][groupVal] : null;
        if (isToggledOn) {
          if (overlayLayer && !map.hasLayer(overlayLayer)) {
            overlayLayer.addTo(map);
          }
          sitesInGroup.forEach(site => {
            const isMatch = matchingSites.some(ms => ms.name === site.name);
            const marker = leafletMarkers[site.name];
            if (isMatch) {
              if (!map.hasLayer(marker)) marker.addTo(map);
            } else {
              if (map.hasLayer(marker)) map.removeLayer(marker);
            }
          });
        } else {
          if (overlayLayer && map.hasLayer(overlayLayer)) {
            map.removeLayer(overlayLayer);
          }
          sitesInGroup.forEach(site => {
            const marker = leafletMarkers[site.name];
            if (map.hasLayer(marker)) map.removeLayer(marker);
          });
        }
      });

      // Update counters
      document.getElementById('stat-total-sites').innerText = totalSitesCount;
      document.getElementById('stat-active-groups').innerText = activeGroupsCount;
    }

    // Toggle expansion of group cards
    window.toggleGroupExpand = function(groupVal) {
      const dim = state.currentView;
      state.expandedGroups[dim][groupVal] = !state.expandedGroups[dim][groupVal];
      updateApp();
    };

    // Toggle group visibility switch
    window.toggleGroupVisibility = function(groupVal, isChecked) {
      const dim = state.currentView;
      state.toggledGroups[dim][groupVal] = isChecked;
      if (isChecked) {
        state.expandedGroups[dim][groupVal] = true;
      }
      updateApp();
    };

    // Backward-compatible wrappers
    window.toggleBucketExpand = window.toggleGroupExpand;
    window.toggleBucketVisibility = window.toggleGroupVisibility;

    // Camera animation to focus on site
    window.focusSite = function(siteName) {
      const site = siteData.find(s => s.name === siteName);
      if (site) {
        const marker = leafletMarkers[siteName];
        if (marker) {
          map.flyTo([site.lat, site.lon], 10, {
            animate: true,
            duration: 1.2
          });
          setTimeout(() => {
            marker.openPopup();
          }, 1200);
        }
      }
    };

    // Search bar input listener
    document.getElementById('search-bar').addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      const dim = state.currentView;
      if (state.searchQuery.length > 0 && groupsData[dim]) {
        Object.keys(groupsData[dim]).forEach(val => {
          state.expandedGroups[dim][val] = true;
        });
      }
      updateApp();
    });

    // Initialize initial active buttons from defaultView
    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-view') === defaultView);
    });

    // Main Init
    initMapLayers();
    updateApp();
    fitMapToSites();

  </script>
</body>
</html>

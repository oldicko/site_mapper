    /* Dark Theme (Default) */
    :root {
      --bg-dark: #0d0d0f;
      --panel-bg: rgba(18, 18, 22, 0.75);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --card-hover: rgba(255, 255, 255, 0.04);
      --font-family: 'Outfit', sans-serif;
      --stat-card-bg: rgba(255, 255, 255, 0.02);
      --stat-card-border: rgba(255, 255, 255, 0.04);
      --search-bg: rgba(0, 0, 0, 0.2);
      --search-border: var(--panel-border);
      --search-focus-bg: rgba(0, 0, 0, 0.4);
      --search-focus-border: rgba(255, 255, 255, 0.2);
      --search-focus-shadow: rgba(255, 255, 255, 0.05);
      --h1-gradient-start: #fff;
      --scroll-thumb: rgba(255, 255, 255, 0.1);
      --scroll-thumb-hover: rgba(255, 255, 255, 0.2);
      --card-bg: rgba(255, 255, 255, 0.01);
      --bucket-card-hover-border: rgba(255, 255, 255, 0.15);
      --bucket-card-hover-bg: rgba(255, 255, 255, 0.02);
      --slider-bg: rgba(255, 255, 255, 0.1);
      --slider-dot: var(--text-muted);
      --site-list-bg: rgba(0, 0, 0, 0.15);
      --popup-bg: rgba(18, 18, 22, 0.9);
      --popup-shadow: rgba(0, 0, 0, 0.6);
      --popup-badge-bg: rgba(255, 255, 255, 0.05);
      --popup-badge-border: rgba(255, 255, 255, 0.05);
      --popup-badge-text: var(--text-muted);
      --popup-coords-text: rgba(255, 255, 255, 0.3);
      --sidebar-shadow: rgba(0, 0, 0, 0.5);
    }

    /* Light Theme Overrides */
    .light-mode {
      --bg-dark: #f8fafc;
      --panel-bg: rgba(255, 255, 255, 0.75);
      --panel-border: rgba(0, 0, 0, 0.08);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #3b82f6;
      --card-hover: rgba(0, 0, 0, 0.02);
      --stat-card-bg: rgba(0, 0, 0, 0.02);
      --stat-card-border: rgba(0, 0, 0, 0.04);
      --search-bg: rgba(255, 255, 255, 0.8);
      --search-border: rgba(0, 0, 0, 0.08);
      --search-focus-bg: #ffffff;
      --search-focus-border: rgba(0, 0, 0, 0.15);
      --search-focus-shadow: rgba(0, 0, 0, 0.03);
      --h1-gradient-start: #0f172a;
      --scroll-thumb: rgba(0, 0, 0, 0.1);
      --scroll-thumb-hover: rgba(0, 0, 0, 0.2);
      --card-bg: rgba(0, 0, 0, 0.005);
      --bucket-card-hover-border: rgba(0, 0, 0, 0.12);
      --bucket-card-hover-bg: rgba(0, 0, 0, 0.02);
      --slider-bg: rgba(0, 0, 0, 0.06);
      --slider-dot: #fff;
      --site-list-bg: rgba(0, 0, 0, 0.02);
      --popup-bg: rgba(255, 255, 255, 0.9);
      --popup-shadow: rgba(0, 0, 0, 0.1);
      --popup-badge-bg: rgba(0, 0, 0, 0.03);
      --popup-badge-border: rgba(0, 0, 0, 0.04);
      --popup-badge-text: var(--text-muted);
      --popup-coords-text: rgba(0, 0, 0, 0.4);
      --sidebar-shadow: rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      width: 100%;
      font-family: var(--font-family);
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
    }

    #app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    #map {
      height: 100%;
      width: 100%;
      z-index: 1;
      background: var(--bg-dark);
    }

    /* Floating Glassmorphic Sidebar */
    .sidebar {
      position: absolute;
      top: 20px;
      left: 20px;
      bottom: 20px;
      width: 380px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px var(--sidebar-shadow);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--panel-border);
    }

    .sidebar-header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--h1-gradient-start) 30%, var(--text-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .sidebar-header p {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 300;
    }

    /* Stats Board */
    .stats-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 24px 20px 24px;
      border-bottom: 1px solid var(--panel-border);
    }

    .stat-card {
      background: var(--stat-card-bg);
      border: 1px solid var(--stat-card-border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* Search */
    .search-container {
      padding: 16px 24px;
      border-bottom: 1px solid var(--panel-border);
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px 12px 40px;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      border-radius: 10px;
      color: var(--text-main);
      font-family: var(--font-family);
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--search-focus-border);
      background: var(--search-focus-bg);
      box-shadow: 0 0 0 2px var(--search-focus-shadow);
    }

    .search-icon {
      position: absolute;
      left: 36px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      width: 16px;
      height: 16px;
    }

    /* Content Area */
    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
    }

    /* Custom Scrollbar */
    .sidebar-content::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .sidebar-content::-webkit-scrollbar-thumb {
      background: var(--scroll-thumb);
      border-radius: 3px;
    }

    .sidebar-content::-webkit-scrollbar-thumb:hover {
      background: var(--scroll-thumb-hover);
    }

    /* Bucket Card styling */
    .bucket-card {
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .bucket-card:hover {
      border-color: var(--bucket-card-hover-border);
      background: var(--bucket-card-hover-bg);
    }

    .bucket-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .bucket-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .bucket-color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: 0 0 6px var(--dot-color);
      background-color: var(--dot-color);
      flex-shrink: 0;
    }

    .bucket-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .bucket-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .site-count-badge {
      background: var(--stat-card-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
    }

    /* Custom Switch Toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--slider-bg);
      transition: .2s;
      border-radius: 18px;
      border: 1px solid var(--panel-border);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 2px;
      bottom: 2px;
      background-color: var(--slider-dot);
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--toggle-color);
    }

    input:checked + .slider:before {
      transform: translateX(14px);
      background-color: #fff;
      box-shadow: 0 0 6px var(--toggle-color);
    }

    /* Site list under bucket */
    .site-list {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-top: 0 solid var(--panel-border);
      background: var(--site-list-bg);
    }

    .bucket-card.expanded .site-list {
      max-height: 500px;
      border-top: 1px solid var(--panel-border);
    }

    .site-item {
      padding: 10px 16px 10px 40px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s;
    }

    .site-item:hover {
      background: var(--card-hover);
      color: var(--text-main);
    }

    .site-coordinates {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.25);
      font-family: monospace;
    }

    /* Toggled Off state */
    .bucket-card.toggled-off {
      opacity: 0.55;
    }
    
    .bucket-card.toggled-off .bucket-name {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* Custom Leaflet Marker Styling */
    .custom-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
    }

    .marker-core {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--marker-color);
      box-shadow: 0 0 10px var(--marker-color);
      z-index: 2;
      border: 1px solid #fff;
    }

    .marker-halo {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background-color: var(--marker-color);
      opacity: 0.3;
      animation: pulse 2.5s infinite ease-in-out;
      z-index: 1;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.5);
        opacity: 0.7;
      }
      100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }

    /* Premium Leaflet Popup Override */
    .leaflet-popup-content-wrapper {
      background: var(--popup-bg) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      border: 1px solid var(--panel-border) !important;
      color: var(--text-main) !important;
      font-family: var(--font-family) !important;
      border-radius: 12px !important;
      box-shadow: 0 15px 35px var(--popup-shadow) !important;
      padding: 4px;
    }

    .leaflet-popup-tip {
      background: var(--popup-bg) !important;
      border-left: 1px solid var(--panel-border) !important;
      border-bottom: 1px solid var(--panel-border) !important;
      box-shadow: none !important;
    }

    .popup-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .popup-bucket {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--popup-badge-text);
      background: var(--popup-badge-bg);
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid var(--popup-badge-border);
    }

    .popup-coords {
      font-size: 10px;
      color: var(--popup-coords-text);
      margin-top: 8px;
      font-family: monospace;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .sidebar {
        width: calc(100% - 40px);
        bottom: auto;
        max-height: 40vh;
      }
    }
  </style>
</head>

    }).addTo(map);

    // Reposition zoom control to bottom right
    L.control.zoom({
      position: 'bottomright'
    }).addTo(map);

    // Dictionaries to hold leaflet layer instances
    const leafletMarkers = {}; // site_name -> marker instance
    const leafletOverlays = {}; // bucket_name -> polygon/polyline/circle instance

    // Initialize toggles and expansions for buckets
    Object.keys(bucketData).forEach(bucketName => {
      state.toggledBuckets[bucketName] = true; // All on by default
      state.expandedBuckets[bucketName] = false; // Collapsed by default
    });

    // Compute bounds and fit map to display all sites initially
    function fitMapToSites() {
      const activeCoords = [];
      siteData.forEach(site => {
        if (state.toggledBuckets[site.bucket]) {
          activeCoords.push([site.lat, site.lon]);
        }
      });
      if (activeCoords.length > 0) {
        map.fitBounds(activeCoords, { padding: [50, 50], maxZoom: 8 });
      }
    }

    // Helper: Create HTML element for custom marker
    function createCustomMarkerIcon(color) {
      return L.divIcon({
        className: 'custom-marker-wrapper',
        html: `<div class="custom-marker" style="--marker-color: ${color}">
                 <div class="marker-core"></div>
                 <div class="marker-halo"></div>
               </div>`,
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });
    }

    // Create marker popup HTML
    function createPopupContent(site, color) {
      return `
        <div style="padding: 4px;">
          <div class="popup-title">${site.name}</div>
          <div class="popup-bucket">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: ${color}; display: inline-block;"></span>
            ${site.bucket}
          </div>
          <div class="popup-coords">${site.lat.toFixed(4)}, ${site.lon.toFixed(4)}</div>
        </div>
      `;
    }

    // Initialize all map shapes and markers
    function initMapLayers() {
      const bufferRadius = config.zone_buffer_radius_km || 40;
      const preventOverlays = config.prevent_overlaps || false;

      // Map to hold custom processed geojson overlays
      const rawBuffers = {};
      const bucketOverlayData = {};

      // First, generate raw buffers for each bucket
      Object.entries(bucketData).forEach(([bucketName, info]) => {
        const hullCoords = info.hull;
        if (hullCoords.length === 0) return;

        let geojson = null;
        try {
          if (hullCoords.length === 1) {
            const pt = turf.point([hullCoords[0][1], hullCoords[0][0]]);
            geojson = turf.buffer(pt, bufferRadius, {units: 'kilometers'});
          } else if (hullCoords.length === 2) {
            const line = turf.lineString(hullCoords.map(c => [c[1], c[0]]));
            geojson = turf.buffer(line, bufferRadius, {units: 'kilometers'});
          } else {
            const coords = hullCoords.map(c => [c[1], c[0]]);
            coords.push([hullCoords[0][1], hullCoords[0][0]]);
            const poly = turf.polygon([coords]);
            geojson = turf.buffer(poly, bufferRadius, {units: 'kilometers'});
          }
        } catch (e) {
          console.error("Error buffering region for " + bucketName + ":", e);
        }
        if (geojson) {
          rawBuffers[bucketName] = geojson;
        }
      });

      // If we want to prevent overlaps, clip them using Voronoi cells of all sites
      if (preventOverlays && siteData.length > 1) {
        try {
          // Convert all sites to Turf points
          const points = siteData.map((site, index) => {
            return turf.point([site.lon, site.lat], { index: index, bucket: site.bucket, name: site.name });
          });
          const pointsFC = turf.featureCollection(points);

          // Bounding box covering a massive range to ensure no cutoff
          const bbox = [-180, -85, 180, 85];
          const voronoiPolys = turf.voronoi(pointsFC, { bbox: bbox });

          // Map each site to its Voronoi cell polygon
          const siteCells = new Map();
          voronoiPolys.features.forEach((cell, cellIdx) => {
            if (!cell) return;
            // Find which site is inside this cell using booleanPointInPolygon
            const ownerPoint = points.find(pt => turf.booleanPointInPolygon(pt, cell));
            if (ownerPoint) {
              siteCells.set(ownerPoint.properties.name, cell);
            }
          });

          // Build bucket influence zones (union of cell polygons of its sites)
          const bucketInfluenceZones = {};
          Object.keys(bucketData).forEach(bucketName => {
            const bucketSites = siteData.filter(s => s.bucket === bucketName);
            let influenceZone = null;

            bucketSites.forEach(site => {
              const cell = siteCells.get(site.name);
              if (!cell) return;
              if (!influenceZone) {
                influenceZone = JSON.parse(JSON.stringify(cell)); // deep clone
              } else {
                try {
                  influenceZone = turf.union(influenceZone, cell);
                } catch (unionErr) {
                  console.error("Union error for bucket " + bucketName + ":", unionErr);
                }
              }
            });

            if (influenceZone) {
              bucketInfluenceZones[bucketName] = influenceZone;
            }
          });

          // Intersect raw buffer of each bucket with its influence zone
          Object.entries(rawBuffers).forEach(([bucketName, rawBuffer]) => {
            const influenceZone = bucketInfluenceZones[bucketName];
            let finalGeom = rawBuffer;

            if (influenceZone) {
              try {
                const intersection = turf.intersect(rawBuffer, influenceZone);
                if (intersection) {
                  finalGeom = intersection;
                }
              } catch (intersectErr) {
                console.error("Intersection error for bucket " + bucketName + ":", intersectErr);
              }
            }

            bucketOverlayData[bucketName] = finalGeom;
          });
        } catch (voronoiErr) {
          console.error("Error computing Voronoi partition, falling back to raw buffers:", voronoiErr);
          // Fallback to raw buffers
          Object.entries(rawBuffers).forEach(([bucketName, rawBuffer]) => {
            bucketOverlayData[bucketName] = rawBuffer;
          });
        }
      } else {
        // Just use raw buffers if preventOverlays is false or <= 1 site
        Object.entries(rawBuffers).forEach(([bucketName, rawBuffer]) => {
          bucketOverlayData[bucketName] = rawBuffer;
        });
      }

      // Add overlays to map
      Object.entries(bucketOverlayData).forEach(([bucketName, geojson]) => {
        const color = bucketData[bucketName].color;
        leafletOverlays[bucketName] = L.geoJSON(geojson, {
          style: {
            color: color,
            fillColor: color,
            fillOpacity: 0.15,
            weight: 2,
            dashArray: '5, 5'
          }
        }).addTo(map);
      });

      // 2. Create markers for each site
      siteData.forEach(site => {
        const bucketInfo = bucketData[site.bucket];
        const color = bucketInfo ? bucketInfo.color : '#ffffff';
        
        const marker = L.marker([site.lat, site.lon], {
          icon: createCustomMarkerIcon(color)
        });

        marker.bindPopup(createPopupContent(site, color), {
          offset: [0, -5]
        });

        // Add to map initially
        marker.addTo(map);
        leafletMarkers[site.name] = marker;
      });
    }

    // Perform rendering of UI and updates to Map layers based on state
    function updateApp() {
      // Get filtered list of sites
      const query = state.searchQuery.toLowerCase();
      
      let totalSitesCount = 0;
      let activeBucketsCount = 0;

      // Render the bucket list inside sidebar
      const container = document.getElementById('bucket-list-container');
      container.innerHTML = '';

      Object.entries(bucketData).forEach(([bucketName, info]) => {
        const color = info.color;
        const sitesInBucket = siteData.filter(site => site.bucket === bucketName);
        
        // Filter sites in this bucket by search query
        const matchingSites = sitesInBucket.filter(site => 
          site.name.toLowerCase().includes(query) || 
          bucketName.toLowerCase().includes(query)
        );

        // Hide bucket entirely if it doesn't match search query and has no matching sites
        if (matchingSites.length === 0 && !bucketName.toLowerCase().includes(query)) {
          // Hide both markers and overlays from map for this bucket
          if (leafletOverlays[bucketName]) map.removeLayer(leafletOverlays[bucketName]);
          sitesInBucket.forEach(site => {
            map.removeLayer(leafletMarkers[site.name]);
          });
          return;
        }

        const isToggledOn = state.toggledBuckets[bucketName];
        if (isToggledOn) {
          activeBucketsCount++;
          totalSitesCount += matchingSites.length;
        }

        // Create Bucket Card Element
        const card = document.createElement('div');
        card.className = `bucket-card ${isToggledOn ? '' : 'toggled-off'} ${state.expandedBuckets[bucketName] ? 'expanded' : ''}`;
        card.style.setProperty('--toggle-color', color);

        // HTML structure for bucket header & switch
        card.innerHTML = `
          <div class="bucket-header">
            <div class="bucket-info" onclick="toggleBucketExpand('${bucketName}')">
              <span class="bucket-color-dot" style="--dot-color: ${color}"></span>
              <span class="bucket-name">${bucketName}</span>
            </div>
            <div class="bucket-actions">
              <span class="site-count-badge">${matchingSites.length} sites</span>
              <label class="switch">
                <input type="checkbox" ${isToggledOn ? 'checked' : ''} onchange="toggleBucketVisibility('${bucketName}', this.checked)">
                <span class="slider"></span>
              </label>
            </div>
          </div>
          <div class="site-list" id="list-${bucketName.replace(/\s+/g, '-')}"></div>
        `;

        container.appendChild(card);

        // Populate sites inside the expanded panel
        const siteListContainer = card.querySelector('.site-list');
        matchingSites.forEach(site => {
          const siteItem = document.createElement('div');
          siteItem.className = 'site-item';
          siteItem.innerHTML = `
            <span>${site.name}</span>
            <span class="site-coordinates">${site.lat.toFixed(3)}, ${site.lon.toFixed(3)}</span>
          `;
          
          // Focus map on site click
          siteItem.onclick = () => {
            if (isToggledOn) {
              focusSite(site.name);
            }
          };

          siteListContainer.appendChild(siteItem);
        });

        // 3. Update Map Visibility for overlay and markers
        if (isToggledOn) {
          // Show overlay
          if (leafletOverlays[bucketName] && !map.hasLayer(leafletOverlays[bucketName])) {
            leafletOverlays[bucketName].addTo(map);
          }
          // Show/Hide markers depending on search match
          sitesInBucket.forEach(site => {
            const isMatch = matchingSites.some(ms => ms.name === site.name);
            const marker = leafletMarkers[site.name];
            if (isMatch) {
              if (!map.hasLayer(marker)) marker.addTo(map);
            } else {
              if (map.hasLayer(marker)) map.removeLayer(marker);
            }
          });
        } else {
          // Hide overlay
          if (leafletOverlays[bucketName] && map.hasLayer(leafletOverlays[bucketName])) {
            map.removeLayer(leafletOverlays[bucketName]);
          }
          // Hide all markers for this bucket
          sitesInBucket.forEach(site => {
            const marker = leafletMarkers[site.name];
            if (map.hasLayer(marker)) map.removeLayer(marker);
          });
        }
      });

      // Update HUD/Stats
      document.getElementById('stat-total-sites').innerText = totalSitesCount;
      document.getElementById('stat-active-buckets').innerText = activeBucketsCount;
    }

    // Toggle expansion of the bucket sites list
    window.toggleBucketExpand = function(bucketName) {
      state.expandedBuckets[bucketName] = !state.expandedBuckets[bucketName];
      updateApp();
    }

    // Toggle bucket visibility layer (checkbox control)
    window.toggleBucketVisibility = function(bucketName, isChecked) {
      state.toggledBuckets[bucketName] = isChecked;
      
      // Auto expand on visibility switch to guide user
      if (isChecked) {
        state.expandedBuckets[bucketName] = true;
      }
      
      updateApp();
    }

    // Focus camera on a single site
    window.focusSite = function(siteName) {
      const site = siteData.find(s => s.name === siteName);
      if (site) {
        const marker = leafletMarkers[siteName];
        if (marker) {
          map.flyTo([site.lat, site.lon], 10, {
            animate: true,
            duration: 1.2
          });
          // Wait for panning animation, then trigger popup
          setTimeout(() => {
            marker.openPopup();
          }, 1200);
        }
      }
    }

    // Listen to Search Bar input
    document.getElementById('search-bar').addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      // Auto expand matching items to show search results clearly
      if (state.searchQuery.length > 0) {
        Object.keys(state.expandedBuckets).forEach(name => {
          state.expandedBuckets[name] = true;
        });
      }
      updateApp();
    });

    // Main Init
    initMapLayers();
    updateApp();
    fitMapToSites();

  </script>
</body>
</html>
